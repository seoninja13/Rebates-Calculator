<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale="1.0">
  <title>Green Rebates Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background: #f0f2f5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Hero Section */
    .hero {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero h1 {
      margin: 0;
      font-size: 2rem;
      color: white;
      font-weight: 600;
    }

    /* Blue Search Bar */
    .blue-search-bar {
      background-color: #3f87cb;
      padding: 1rem;
      margin-bottom: 2rem;
    }

    .select-all-row {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .select-all {
      width: auto;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .select-all.active {
      background-color: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
    }

    .category-icons {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5em;
      row-gap: 1.25em;
      width: 100%;
      color: white;
    }

    .category-icon {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      height: 24px;
      box-sizing: border-box;
      width: 100%;
      white-space: nowrap;
    }

    .category-icon:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .category-icon.active {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: white;
      font-weight: 500;
      height: auto;
      min-height: 24px;
    }

    .category-icon i {
      font-size: 1.2rem;
      width: 1.5rem;
      text-align: center;
      flex-shrink: 0;
    }

    @media (max-width: 1200px) {
      .category-icons {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .category-icons {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .category-icon {
        padding: 0.4rem;
        font-size: 0.9rem;
      }
      
      .category-icon i {
        font-size: 1rem;
        width: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .category-icons {
        grid-template-columns: 1fr;
      }
      
      .category-icon {
        padding: 0.3rem;
        font-size: 0.85rem;
      }
    }

    /* Search Section */
    .search-section {
      border-radius: 8px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 23%;
    }

    .location-selector {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex: 1;
    }

    #countySelect {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }

    /* Category Section */
    .category-section {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .category-header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      font-size: 1.5rem;
      margin: 0;
    }

    .category-content {
      padding: 1rem;
    }

    .rebate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }

    .rebate-row:last-child {
      border-bottom: none;
    }

    .rebate-title {
      font-size: 1.1rem;
      color: #333;
    }

    .rebate-amount {
      font-size: 1.1rem;
      color: #2E7D32;
      font-weight: 500;
    }

    /* Results Container */
    #resultsContainer {
      display: none;
    }

    /* Project Types */
    .project-types {
      display: flex;
      gap: 1rem;
      margin-left: auto;
      color: white;
    }

    .project-type {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .project-type i {
      font-size: 1.2rem;
    }

    .program-section {
      background-color: #fff;
      margin-bottom: 15px;
    }

    .program-section h2 {
      background-color: #4CAF50;
      color: white;
      margin: 0;
      padding: 1rem;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #2E7D32;
    }

    .program-content {
      display: flex;
      flex-direction: column;
      gap: 0rem;
    }

    .program-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      font-size: 1rem;
    }

    .program-row:last-child {
      border-bottom: none;
    }

    .program-title {
      flex: 1;
      padding-right: 2rem;
      color: #333;
    }
